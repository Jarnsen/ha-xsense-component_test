force_arm:
  name: Force arm
  description: Confirm a pending X-Sense Home or Away arm request after open sensors blocked the normal request.
  target:
    entity:
      integration: xsense
      domain: alarm_control_panel
  fields:
    mode:
      required: true
      selector:
        select:
          translation_key: force_arm_mode
          options:
            - home
            - away

force_arm_now:
  name: Force arm now
  description: Force arm an X-Sense system in Home or Away mode without waiting for or showing a confirmation prompt. Open sensors are bypassed.
  target:
    entity:
      integration: xsense
      domain: alarm_control_panel
  fields:
    mode:
      required: true
      selector:
        select:
          translation_key: force_arm_mode
          options:
            - home
            - away

trigger_sos:
  name: Trigger SOS alarm
  description: Trigger the X-Sense SBS50 SOS alarm. This sounds the physical alarm immediately.
  target:
    entity:
      integration: xsense
      domain: alarm_control_panel

cancel_sos:
  name: Cancel SOS alarm
  description: Cancel an active X-Sense SBS50 SOS alarm.
  target:
    entity:
      integration: xsense
      domain: alarm_control_panel

cancel_alarm:
  name: Cancel active alarm
  description: Cancel an active X-Sense SBS50 sensor alarm using the same command as the X-Sense app.
  target:
    entity:
      integration: xsense
      domain: alarm_control_panel

set_sos_sound:
  name: Set SOS sound
  description: Choose whether an SBS50 SOS alarm flashes its light only or also sounds its buzzer.
  target:
    entity:
      integration: xsense
      domain: alarm_control_panel
  fields:
    audible:
      name: Audible alarm
      description: Enable the SBS50 buzzer as well as the flashing light for SOS alarms.
      required: true
      selector:
        boolean:

refresh_recordings:
  name: Refresh recordings
  description: Refresh the cached X-Sense camera recording index used by the X-Sense Recordings sidebar and Home Assistant Media Browser.
  fields:
    entry_id:
      selector:
        text:

cache_recordings:
  name: Cache recordings
  description: Download X-Sense camera recordings for local retention. This service only downloads media when Keep local recordings is selected.
  fields:
    entry_id:
      selector:
        text:

clear_recordings_cache:
  name: Clear recordings cache
  description: Clear local X-Sense recording indexes, videos, and thumbnails. Recordings on X-Sense storage are not changed.
  fields:
    entry_id:
      selector:
        text:

