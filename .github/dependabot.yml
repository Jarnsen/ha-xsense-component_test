version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/St_Johns"
    labels:
      - "dependency-update"
      - "github-actions"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "America/St_Johns"
    labels:
      - "dependency-update"
      - "python"
    open-pull-requests-limit: 3
    groups:
      python-test-requirements:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/tools/xsense_pion_adapter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "America/St_Johns"
    labels:
      - "dependency-update"
      - "go"
    open-pull-requests-limit: 3
    groups:
      go-adapter:
        patterns:
          - "*"
