name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-test.txt
            requirements-ui-test.txt

      - name: Set up Node for recordings panel lifecycle tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-runtime.txt -r requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests

      - name: Run minimum Home Assistant tests on loopback only
        if: matrix.python-version == '3.13'
        run: |
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            test "$(ip -o link show | wc -l)" -eq 1
            exec runuser -u "$1" -- env "PATH=$2" PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              "$3" -m pytest -p pytest_asyncio.plugin -q
          ' xsense-minimum-tests "$(id -un)" "$PATH" "$(command -v python)"

      - name: Run test suite
        if: matrix.python-version == '3.14'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q

      - name: Install browser test dependencies
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install -r requirements-ui-test.txt
          python -m playwright install --with-deps chromium

      - name: Test recordings panel in all supported languages
        if: matrix.python-version == '3.14'
        run: python scripts/test-recordings-panel-browser.py
