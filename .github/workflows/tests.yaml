name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-test.txt
            requirements-ui-test.txt

      - name: Set up Node for recordings panel lifecycle tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-runtime.txt -r requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests

      - name: Run test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q

      - name: Install browser test dependencies
        if: github.repository_owner == 'Wheemer' && matrix.python-version == '3.14'
        run: |
          python -m pip install -r requirements-ui-test.txt
          python -m playwright install --with-deps chromium

      - name: Test recordings panel in all supported languages
        if: github.repository_owner == 'Wheemer' && matrix.python-version == '3.14'
        run: python scripts/test-recordings-panel-browser.py
