name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21.13"

      - name: Run OpenSSF Scorecard
        env:
          ENABLE_SARIF: "1"
          SCORECARD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go install github.com/ossf/scorecard/v4@v4.13.1
          "${HOME}/go/bin/scorecard" --repo="${{ github.server_url }}/${{ github.repository }}" --format=sarif --output=results.sarif

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
