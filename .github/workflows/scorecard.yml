name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenSSF Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scorecard_archive="scorecard_4.13.1_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$scorecard_archive" \
            "https://github.com/ossf/scorecard/releases/download/v4.13.1/$scorecard_archive"
          echo "53aa07786f2d985d0755ff9caad4e38c0a22596708de0728c5274f84ae48f785  $scorecard_archive" | sha256sum --check
          tar --extract --gzip --file "$scorecard_archive" scorecard-linux-amd64
          ./scorecard-linux-amd64 --repo="${{ github.server_url }}/${{ github.repository }}" --format=json --output=scorecard-results.json

      - name: Upload Scorecard report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: scorecard-results.json
          if-no-files-found: error
